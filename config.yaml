models:
  default_params:
    temperature: 0.1
    top_p: 0.9
    max_tokens: 4096

  providers:
    ollama:
      type: ollama
      endpoint: "http://localhost:11434"
    yandex:
      type: openai
      endpoint: "https://llm.api.cloud.yandex.net/foundationModels/v1"
      api_key: "${YANDEX_API_KEY}"
    cloudru:
      type: openai
      endpoint: "https://api.cloud.ru/v1"
      api_key: "${CLOUDRU_API_KEY}"
    openrouter:
      type: openai
      endpoint: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"

  routing:
    text_model:
      - { provider: ollama,   model: gemma4:e4b }
      - { provider: yandex,   model: yandexgpt }
      - { provider: openrouter, model: openai/gpt-4o-mini }
    vision_model:
      - { provider: ollama,   model: qwen3.5:9b }
      - { provider: openrouter, model: openai/gpt-4o-mini }
    classifier_model:
      - { provider: ollama,   model: qwen3.5:0.8b }
      - { provider: yandex,   model: yandexgpt }
    mixer_model:
      - { provider: ollama,   model: gemma4:e4b }
      - { provider: openrouter, model: openai/gpt-4o-mini }
    moderation_model:
      - { provider: ollama,   model: gemma4:e4b }
      - { provider: yandex,   model: yandexgpt }
    embedding_model:
      - { provider: ollama,   model: qwen3-embedding:0.6b }
      - { provider: yandex,   model: yandex-embed }

  whisper:
    binary: "~/bin/whisper-cli"
    model: "~/whisper.cpp/models/ggml-large-v3.bin"

  rapidocr:
    model: "v4"

timeouts:
  whisper_asr: 300
  speechbrain_diarization: 120
  rapidocr_inference: 30
  qwen_pass1_text: 180
  qwen_pass2_vision: 600  # Qwen3.5:9b тратит время на thinking
  qwen_frontmatter: 180
  llm_general_default: 120
  domain_router: 120
  pipeline_total: 7200  # увеличен из-за медленного thinking VLM

retry:
  max_attempts: 3
  base_delay_sec: 1.0
  max_delay_sec: 10.0
  backoff_factor: 2.0

circuit_breaker:
  failure_threshold: 10
  recovery_timeout_sec: 60
  half_open_max_requests: 1

fallback_chain:
  - "retry_same"
  - "shorten_prompt"
  - "skip_vision"

audio:
  sample_rate: 16000
  channels: 1
  temp_dir: "/tmp/rutube-audio"

ocr:
  confidence_threshold: 0.5
  buffer_window_sec: 5

genres:
  labels:
    - id: podcast
      description: "разговорный формат, интервью, обсуждение без визуального контента"
      vision_blocked: true
      fallback_keywords: ["подкаст", "выпуск", "гость", "интервью"]
    - id: lecture
      description: "лекция, урок, образовательный контент"
      vision_blocked: true
      fallback_keywords: ["лекция", "урок", "курс", "занятие"]
    - id: stream
      description: "стрим, прямой эфир, трансляция"
      vision_blocked: true
      fallback_keywords: ["стрим", "лайв", "прямой эфир", "трансляция"]
    - id: how_to
      description: "инструкция, туториал, ремонт, сборка"
      vision_blocked: false
      fallback_keywords: ["как", "инструкция", "гайд", "туториал"]
    - id: review
      description: "обзор товара, распаковка, тест-драйв"
      vision_blocked: false
      fallback_keywords: ["обзор", "распаковка", "тест", "отзыв"]
    - id: tech_review
      description: "обзор техники, гаджетов, ПО, сравнение характеристик"
      vision_blocked: false
      fallback_keywords: ["гаджет", "техника", "смартфон", "ноутбук"]
    - id: diy
      description: "сделай сам, крафт, хендмейд, рукоделие"
      vision_blocked: false
      fallback_keywords: ["своими руками", "diy", "handmade"]
    - id: diy_crafts
      description: "поделки, мастер-классы по изготовлению, хобби-проекты"
      vision_blocked: false
      fallback_keywords: ["поделка", "мастер-класс", "хобби", "крафт"]
    - id: game_review
      description: "обзор или прохождение компьютерной игры, гейминг"
      vision_blocked: false
      fallback_keywords: ["обзор игры", "геймплей", "прохождение", "киберспорт", "летсплей"]
    - id: travel_vlog
      description: "тревел-влог, путешествия, жизнь за границей"
      vision_blocked: false
      fallback_keywords: ["путешеств", "тревел", "отпуск", "переезд", "зимовка"]
    - id: entertainment
      description: "развлечения: кино, сериалы, шоу, обзор фильма"
      vision_blocked: false
      fallback_keywords: ["фильм", "кино", "сериал", "кинообзор"]
    - id: true_crime
      description: "криминал, детектив, расследование"
      vision_blocked: true
      fallback_keywords: ["убийство", "преступление", "детектив", "расследование"]
    - id: education
      description: "обучение, наука, познавательный контент, документалистика"
      vision_blocked: true
      fallback_keywords: ["обучение", "наука", "документальный", "познавательный"]
    - id: unknown
      description: "не подходит ни под одну из вышеперечисленных категорий"
      vision_blocked: false
      fallback_keywords: []

fingerprint:
  enabled: true
  min_confidence: 0.7
  chunk_duration_sec: 5
  overlap_ratio: 0.5
  db_path: "./data/fingerprint_db.json"

celebrity_recognition:
  enabled: true
  min_confidence: 0.6

search:
  collection: "rutube_scenes"
  embedding_model: "qwen3-embedding:0.6b"
  top_k: 20
  chroma_path: "./data/chroma"

mixer:
  llm_model: "gemma4:e4b"
  max_videos_per_stage: 3

passport:
  output_dir: "./output"
